name: Sync Upstream Template
# Pulls the latest changes from the upstream template repository and opens a PR
# with the diff, excluding app-specific folders that should never be overwritten.
#
# Process (wholesale copy, not a git merge):
#   1. Checks out this repo (downstream) and creates the chore/sync-upstream branch.
#   2. Clones the upstream template into a scratch dir and strips apps/, db/, .git
#      from it — upstream should never be able to touch those paths.
#   3. Pulls this repo's own apps/, db/, and local-* workflows/actions aside, wipes
#      everything else in the working tree, copies the (already-stripped) upstream
#      tree in wholesale, then puts the protected paths back.
#      Deletions are handled for free: anything upstream removed is simply never
#      copied back in — no separate diff/comm step needed.
#   4. If any files changed, opens a PR on branch chore/sync-upstream for review.
#
# Trigger: run manually via workflow_dispatch.
# Protected branches: safe — changes are pushed to chore/sync-upstream, never directly
#   to the target branch. A human reviews and merges the PR as normal.
#
# Required secret: SYNC_TOKEN
#   The built-in GITHUB_TOKEN cannot create or update workflow files (.github/workflows/).
#   A personal access token with both `repo` and `workflow` scopes is required instead.
#
#   Setup:
#     Classic PAT:
#       1. GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#       2. Generate new token → tick BOTH `repo` (for push + PR creation) AND `workflow` (for
#          writing .github/workflows/ files) — these are separate scopes; neither implies the other
#       3. Copy the token value.
#
#     Fine-grained PAT (repo-scoped):
#       1. GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens
#       2. Set Resource owner to the repo's owner, Important! Names must match
#       3. Under Permissions → Repository permissions, grant:
#            - Contents: Read and write
#            - Pull requests: Read and write
#            - Workflows: Read and write
#       4. Copy the token value.
#
#     Add to repo:
#       Repository → Settings → Secrets and variables → Actions → New repository secret
#       Name: SYNC_TOKEN   Value: <token copied above>

on:
  # schedule:
  #   - cron: '0 9 * * 1'  # every Monday 9am UTC
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to sync from. Defaults to main'
        default: 'main'
        required: false
      ref:
        description: Downstream branch to check out. Defaults to the ref that triggered the workflow.
        required: false
        default: ''

env:
  UPSTREAM_URL: https://github.com/ais-one/novex-kit.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Display Inputs
        run: echo "${{ toJSON(github.event.inputs) }}"

      # done this way because of SYNC_TOKEN
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1

      - name: Create sync branch
        env:
          SYNC_BRANCH: chore/sync-upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"

      # Upstream never gets a say over apps/ or db/ — strip them (and .git) from the
      # scratch clone so there's nothing for the copy step below to bring in.
      - name: Clone upstream template (strip protected paths)
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "${{ env.UPSTREAM_URL }}" /tmp/upstream-src
          rm -rf /tmp/upstream-src/apps /tmp/upstream-src/db /tmp/upstream-src/.git

      # Pull our own protected paths out of the way, wipe everything else, copy in
      # upstream's tree wholesale, then put the protected paths back. Deletions are
      # handled for free this way — anything upstream removed is simply never
      # copied back in, so no separate diff/comm step is needed to detect them.
      - name: Apply upstream (protect apps/, db/, local-* workflows/actions)
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p /tmp/protected/.github/workflows /tmp/protected/.github/actions
          [ -d apps ] && mv apps /tmp/protected/apps
          [ -d db ] && mv db /tmp/protected/db
          for f in .github/workflows/local-*.yml; do mv "$f" /tmp/protected/.github/workflows/; done
          for d in .github/actions/local-*; do mv "$d" /tmp/protected/.github/actions/; done

          # wipe everything in the working tree except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # copy in upstream's tree (already stripped of apps/, db/, .git)
          cp -a /tmp/upstream-src/. .

          # restore our protected paths, overwriting anything upstream happened to place there
          [ -d /tmp/protected/apps ] && rm -rf apps && mv /tmp/protected/apps apps
          [ -d /tmp/protected/db ] && rm -rf db && mv /tmp/protected/db db
          mkdir -p .github/workflows .github/actions
          for f in /tmp/protected/.github/workflows/*; do mv "$f" .github/workflows/; done
          for d in /tmp/protected/.github/actions/*; do mv "$d" .github/actions/; done

      # Regenerate lock file so upstream package.json version changes are reflected.
      # Uses npm install (not ci) so the lock file is updated, not validated.
      # The updated package-lock.json is picked up by git add -A in the next step.
      - name: Set up Node and regenerate lock file
        uses: ./.github/actions/setup-node-npm-install
        with:
          install-command: npm install

      - name: Push sync branch
        env:
          SYNC_BRANCH: chore/sync-upstream
        run: |
          git add -A
          git commit -m "chore: sync from upstream template"
          git push origin "$SYNC_BRANCH" --force --no-verify
