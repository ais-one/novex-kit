# .github/workflows/ci-quality.yml
#
# Wires together 7 quality/security checks, summarised by one required PR status check:
#   1. Gitleaks          - secret scanning
#   2. npm audit         - known CVEs in production npm dependencies
#   2B. Dependency review - blocks PRs that introduce vulnerable dependencies (PRs, public repos only)
#   3. Semgrep CE        - SAST, blocking (private/internal repos only)
#   3B. CodeQL           - SAST via code scanning (public repos only; blocks merges
#                          only with a "Require code scanning results" ruleset)
#   4. jscpd             - copy-paste/duplication detection, run as 3 checks: root, apps/, db/
#                          (OPTIONAL - see toggle below)
#   5. SkillSpector      - security scan of AI agent skills (.claude/skills, .github/skills,
#                          apps/.claude/skills, apps/*/.claude/skills),
#                          blocking when a skill's risk score is over 50
#   (Test coverage / Codecov lives in ci-tests.yml, with the unit tests it runs.)
#
# To leave out jscpd entirely: delete the `duplication` job below, and remove
# it from the `needs:` list on `quality-summary`. Alternatively, keep it
# but make it non-blocking by setting `continue-on-error: true` on the job
# (see commented option inline).
#
# SOC2 security jobs are: secret-scan, npm-audit, dependency-audit, sast-private-repo-semgrep, sast-public-repo-codeql.

# Called by ci.yml after lint passes (PRs into rel/x.y only) -
# no triggers of its own. Concurrency is handled by the caller.

name: CI Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ── SOC2 - 1. Secret scanning ────────────────────────────────────────────
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits via the API
    env:
      # `secrets` can't be used in a step `if:` - expose it via env instead.
      # The scan is skipped when there's no license (or on fork PRs, which get no secrets).
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only required for repos owned by a GitHub organization
    steps:
      - name: Skip Gitleaks (no GITLEAKS_LICENSE)
        if: env.GITLEAKS_LICENSE == ''
        run: echo "::notice title=Gitleaks skipped::GITLEAKS_LICENSE secret not set - secret scan not run"
      - uses: actions/checkout@v7
        if: env.GITLEAKS_LICENSE != ''
        with:
          fetch-depth: 0 # full history needed for diff scan
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: env.GITLEAKS_LICENSE != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SOC2 - 2. SCA — npm audit ────────────────────────────────────────────
  # Checks the root package-lock.json (covers all workspaces) for known CVEs
  # in production dependencies. Runs on every PR into rel/x.y - no scope detection.
  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      - name: Run NPM audit
        shell: bash
        # set --audit-level=high for more leniency
        run: |
          set -euo pipefail
          npm run ci:audit

  # ── SOC2 - 2B. SCA — dependency review ───────────────────────────────────
  # Complements npm-audit: blocks PRs that *introduce* vulnerable dependencies.
  # This job only works on pull_request events, and needs the dependency graph
  # enabled. It runs on public repos only - private repos need GitHub Code
  # Security; if you have it, drop the visibility check.
  dependency-audit:
    name: Dependency vulnerability scan
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        # Compares base vs head — blocks PRs that introduce new vulns
  # ── SOC2 - 3. SAST Semgrep CE - private/internal repos only
  # Public repos use CodeQL (3B) instead, which is free there. Semgrep fails
  # the job on findings (--error), so it blocks quality-summary.
  # Runs in the official Semgrep container, so no license or login is needed.
  # Results are NOT uploaded to the GitHub code scanning tab (that needs
  # GitHub Code Security on private repos); the SARIF report is kept as a
  # build artifact instead, which also works as audit evidence.
  sast-private-repo-semgrep:
    name: Security Scan - Semgrep
    if: github.event.repository.visibility != 'public'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for --baseline-commit on PRs
      # - name: "Run Semgrep PAID version"
      #   run: semgrep ci --config auto --severity ERROR
      #   env:
      #     SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: "Run Semgrep (PRs: only fail on NEW findings)"
        if: github.event_name == 'pull_request'
        env:
          SEMGREP_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --baseline-commit "$SEMGREP_BASELINE" \
            --metrics=off \
            --error \
            --sarif --output semgrep.sarif

      - name: "Run Semgrep (pushes: full scan)"
        if: github.event_name != 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --metrics=off \
            --error \
            --sarif --output semgrep.sarif
        # --error makes the job exit non-zero when findings exist, which is
        # what turns Semgrep into a blocking gate. --metrics=off disables
        # telemetry, which is useful for SOC2/HIPAA data-flow documentation.
      # Renders the findings as a table on the run's Summary page, so they can
      # be read without downloading the artifact. python3 ships in the Semgrep
      # image (jq does not).
      - name: Write SARIF findings to job summary
        if: always()
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}
        shell: python3 {0}
        run: |
          import json, os

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("## Semgrep findings\n\n")
          if not os.path.exists("semgrep.sarif"):
              out.write("No SARIF report was produced - check the Semgrep step log.\n")
              raise SystemExit(0)

          def cell(text):
              return " ".join(str(text).split()).replace("|", "\\|")

          rows = []
          for run in json.load(open("semgrep.sarif")).get("runs", []):
              levels = {r["id"]: r.get("defaultConfiguration", {}).get("level", "warning")
                        for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for res in run.get("results", []):
                  loc = res.get("locations", [{}])[0].get("physicalLocation", {})
                  path = loc.get("artifactLocation", {}).get("uri", "?")
                  line = loc.get("region", {}).get("startLine", 1)
                  level = res.get("level") or levels.get(res.get("ruleId"), "warning")
                  rows.append((level, path, line, res.get("ruleId", "?"), res.get("message", {}).get("text", "")))

          if not rows:
              out.write("No findings.\n")
              raise SystemExit(0)

          order = {"error": 0, "warning": 1, "note": 2}
          rows.sort(key=lambda r: (order.get(r[0], 3), r[1], r[2]))
          out.write(f"**{len(rows)} finding(s)** - full report in the `semgrep-sarif` artifact.\n\n")
          out.write("| Level | Location | Rule | Message |\n|---|---|---|---|\n")
          for level, path, line, rule, msg in rows:
              link = f"[{cell(path)}:{line}]({os.environ['BLOB_URL']}/{path}#L{line})"
              out.write(f"| {level} | {link} | `{cell(rule.split('.')[-1])}` | {cell(msg)[:300]} |\n")

      - name: Upload SARIF report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 90

  # ── SOC2 - 3B. CodeQL - public repos only
  # Code scanning is free on public repos; private repos need GitHub Code
  # Security, so the job is skipped there (a skipped job does not fail
  # quality-summary). If you have Code Security, drop the visibility check.
  # Results appear under Security > Code scanning. Do NOT also enable CodeQL
  # "default setup" in repo settings - GitHub rejects workflow uploads while
  # default setup is on.
  # For a weekly full scan, add to `on:` above:
  #   schedule:
  #     - cron: '23 3 * * 1' # weekly, Monday 03:23 UTC
  sast-public-repo-codeql:
    name: SAST CodeQL Analysis (${{ matrix.language }})
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # JS/TS, Python and Actions need no build
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml # query exclusions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------
  # 4. jscpd - duplication detection (OPTIONAL)
  # ---------------------------------------------------------------------
  duplication:
    name: Duplication Check (jscpd)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory-only: duplication over threshold does not block the gate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      # jscpd is pinned in root devDependencies (bumped by Dependabot).
      # Three separate checks, each with its own config (shared with local runs):
      #   root - .jscpd.json       (everything except apps/ and db/)
      #   apps - apps/.jscpd.json  (ignore paths are relative to apps/)
      #   db   - db/.jscpd.json    (ignore paths are relative to db/)
      # jscpd reads only one config per run - no merging or `extends` - so each
      # config is complete on its own. `threshold` fails a check if duplication
      # in that group exceeds it. Duplicates across groups are not detected.
      # Tune per-repo; migrations/generated code often need higher tolerance.
      # `if: !cancelled()` runs every check even if an earlier one fails.
      - name: Run jscpd (root)
        run: npm run ci:dup:root -- --reporters "console,github"

      - name: Run jscpd (apps)
        if: ${{ !cancelled() }}
        run: npm run ci:dup:apps -- --reporters "console,github"

      - name: Run jscpd (db)
        if: ${{ !cancelled() }}
        run: npm run ci:dup:db -- --reporters "console,github"

  # ---------------------------------------------------------------------
  # 5. SkillSpector - security scan of AI agent skills
  # ---------------------------------------------------------------------
  # Scans every skill folder (one with a SKILL.md) under .claude/skills,
  # .github/skills, apps/.claude/skills and apps/*/.claude/skills for prompt injection, data exfiltration, unsafe commands
  # and supply-chain risks. https://github.com/NVIDIA/skillspector
  #
  # Blocking: a skill fails the job when its risk score is over 50 (SkillSpector's
  # default gate); lower-risk findings are listed in the job summary and the
  # JSON reports artifact without failing it. Accepted false positives live in
  # .skillspector-baseline.yaml. A baseline can't be used on a multi-skill
  # (--recursive) scan, so each skill is scanned on its own.
  #
  # LLM analysis: with the ANTHROPIC_API_KEY secret set, the skills' file contents
  # are sent to Anthropic for semantic analysis; without it (and on fork PRs, which
  # get no secrets) the scan is static only (--no-llm). Static mode still sends
  # declared dependency names - not file contents - to OSV.dev for CVE lookups.
  #
  # SkillSpector isn't on PyPI and Dependabot can't track it: it's installed from
  # git at the commit SHA of a release tag. Bump SKILLSPECTOR_REF by hand.
  # Commands (.claude/commands) and agents (.claude/agents) aren't skill folders,
  # so they aren't scanned.
  skill-scan:
    name: Skill scan (SkillSpector)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKILLSPECTOR_REF: 54824463814a0be01360792523ec7245a69190fc # v2.13.4
      # `secrets` can't be used in a step `if:` - expose it via env instead.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional - enables LLM analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install SkillSpector
        run: uv tool install --python 3.12 "git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_REF}"

      - name: Scan skills
        shell: bash
        run: |
          set -uo pipefail # no -e: scan every skill, then fail once at the end
          shopt -s nullglob
          if [[ -n "${ANTHROPIC_API_KEY}" ]]; then
            export SKILLSPECTOR_PROVIDER=anthropic
            llm_flag=()
            echo "::notice title=SkillSpector::LLM analysis enabled (anthropic)"
          else
            llm_flag=(--no-llm)
            echo "::notice title=SkillSpector::ANTHROPIC_API_KEY not set - static scan only (--no-llm)"
          fi

          mkdir -p skillspector-reports
          failed=0
          scanned=0
          for manifest in .claude/skills/*/SKILL.md .github/skills/*/SKILL.md \
            apps/.claude/skills/*/SKILL.md apps/*/.claude/skills/*/SKILL.md; do
            skill_dir="$(dirname "$manifest")"
            report_name="${skill_dir#.}"          # .claude/skills/x -> claude/skills/x (no dotfile)
            report="skillspector-reports/${report_name//\//_}.json"
            echo "::group::${skill_dir}"
            skillspector scan "$skill_dir" "${llm_flag[@]}" \
              --baseline .skillspector-baseline.yaml \
              --format json --output "$report"
            status=$?
            echo "::endgroup::"
            scanned=$((scanned + 1))
            # exit 1 = risk score over 50, exit 2 = scan error - both fail the job
            if [[ $status -ne 0 ]]; then
              echo "::error title=SkillSpector::${skill_dir} failed (exit ${status})"
              failed=1
            fi
          done

          echo "Scanned ${scanned} skill(s)."
          exit "$failed"

      # Renders the reports as tables on the run's Summary page, so they can be
      # read without downloading the artifact. python3 ships on ubuntu-latest.
      - name: Write findings to job summary
        if: always()
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}
        shell: python3 {0}
        run: |
          import glob, json, os

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("## SkillSpector\n\n")
          reports = sorted(glob.glob("skillspector-reports/*.json"))
          if not reports:
              out.write("No reports were produced - check the scan step log.\n")
              raise SystemExit(0)

          def cell(text):
              return " ".join(str(text).split()).replace("|", "\\|")

          skills, findings = [], []
          for path in reports:
              data = json.load(open(path))
              for s in data.get("skills") or [data]:
                  risk = s.get("risk_assessment", {})
                  cov = s.get("analysis_completeness", {})
                  source = os.path.relpath(s.get("skill", {}).get("source", "."), os.getcwd())
                  name = source if source != "." else os.path.basename(path)[:-5]
                  issues = s.get("issues", [])
                  skills.append((name, risk.get("score", s.get("risk_score", "?")),
                                 risk.get("recommendation", "?"), len(issues),
                                 s.get("suppressed_count", 0), cov.get("coverage_percent", "?")))
                  for i in issues:
                      loc = i.get("location", {})
                      file = f"{source}/{loc.get('file', '?')}"
                      line = loc.get("start_line") or 1
                      findings.append((i.get("severity", "?"), name, file, line,
                                       i.get("id", "?"), i.get("pattern") or i.get("category", ""),
                                       i.get("explanation", "")))

          out.write("A skill fails the job when its risk score is over 50. Full reports are in the `skillspector-reports` artifact.\n\n")
          out.write("| Skill | Risk score | Recommendation | Active findings | Suppressed | Coverage % |\n|---|---|---|---|---|---|\n")
          for row in skills:
              out.write("| " + " | ".join(cell(c) for c in row) + " |\n")

          if findings:
              order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}
              findings.sort(key=lambda f: (order.get(f[0], 5), f[1], f[2], f[3]))
              out.write(f"\n### {len(findings)} active finding(s)\n\n")
              out.write("| Severity | Location | Rule | Explanation |\n|---|---|---|---|\n")
              for sev, _, file, line, rule, pattern, why in findings:
                  link = f"[{cell(file)}:{line}]({os.environ['BLOB_URL']}/{file}#L{line})"
                  out.write(f"| {sev} | {link} | `{cell(rule)}` {cell(pattern)} | {cell(why)[:300]} |\n")

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-reports
          path: skillspector-reports/
          retention-days: 90

  # ---------------------------------------------------------------------
  # Summary gate - use this single job as your one required branch-protection check
  # ---------------------------------------------------------------------
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [
        secret-scan,
        npm-audit,
        dependency-audit,
        sast-private-repo-semgrep,
        sast-public-repo-codeql,
        duplication,
        skill-scan,
      ] # remove `duplication` here if you drop that job
    # dependency-audit and the two sast-* jobs may be `skipped` (repo visibility) - `skipped` passes;
    # `failure` and `cancelled` fail the gate
    if: always()
    steps:
      - name: Check all jobs succeeded
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" || "$HAS_CANCELLED" == "true" ]]; then
            echo "::error::One or more quality gate jobs failed or were cancelled."
            exit 1
          fi
          echo "All quality gates passed."
