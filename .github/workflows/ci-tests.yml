## Test workflow - schema, unit and integration tests for every workspace that has the matching script.
## Called by ci-lint.yml after lint passes (PRs into / pushes to main and rel/x.y) - no triggers of its own.
name: CI Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  schema-tests:
    name: Schema Validation Tests
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      - name: Schema tests for common/schemas and apps/*/schemas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in common/schemas apps/*/schemas; do
            [ -d "$dir" ] || continue
            echo "Running schema tests for $dir"
            npm run test:schemas -- "$dir"
          done

  unit-tests:
    name: Unit Tests
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      - name: Run unit tests in every workspace that has test:unit
        run: npm run test:unit --workspaces --if-present

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: false && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      - name: Run integration tests in every workspace that has test:integration
        run: npm run test:integration --workspaces --if-present

  # TODO: e2e tests disabled for now - restore this job to re-enable them.
  # e2e-tests:
  #   name: E2E Tests
  #   needs: integration-tests
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7
  #
  #     - name: Set up workspace
  #       uses: ./.github/actions/setup-node-npm-install
  #
  #     - name: Run e2e tests in every workspace that has test:e2e
  #       run: npm run test:e2e --workspaces --if-present

  # ---------------------------------------------------------------------
  # Summary gate - use this single job as your one required branch-protection check
  # ---------------------------------------------------------------------
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [schema-tests, unit-tests, integration-tests] # add e2e-tests here when re-enabled
    # `skipped` passes (disabled jobs, integration tests on push); `failure` and `cancelled` fail the gate
    if: always()
    steps:
      - name: Check all jobs succeeded
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" || "$HAS_CANCELLED" == "true" ]]; then
            echo "::error::One or more test jobs failed or were cancelled."
            exit 1
          fi
          echo "All test gates passed."
