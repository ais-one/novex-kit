## PR title lint - the PR title must follow Conventional Commits (feat|fix|chore only).
## PRs into rel/x.y are squash-merged, so the title becomes the commit on rel/x.y that
## git-cliff reads for versions and release notes; ci.yml only checks the PR's own commits.
## Runs only on PRs into rel/x.y: PRs into main are merge commits (title unused) and PRs into
## other branches never reach the history git-cliff reads - checking them only adds noise.
## Separate from ci.yml so a title edit (`edited`) re-runs only this check, not lint/tests/gates.
## Make "PR Title Format" a required check on rel/x.y.
name: CI PR Title

on:
  pull_request:
    branches: ["rel/[0-9]*.[0-9]*"]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ci-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|chore)(\([^)]+\))?!?: .{1,}$'
          if [[ "$PR_TITLE" =~ $PATTERN ]]; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "::error::Non-conventional PR title: $PR_TITLE"
            echo "  Expected: type(scope): description"
            echo "  Types:    feat|fix|chore"
            echo "  Note:     use chore for docs|style|refactor|perf|test|build|ci|revert changes"
            echo "  Why:      PRs are squash-merged - the title becomes the commit git-cliff reads"
            exit 1
          fi
