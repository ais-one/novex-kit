## Main repository CI workflow.
## Fails if .github/workflows/** or .github/actions/** are changed - use ci-meta.yml instead.
## Excludes chore/ci branches because CI meta changes are handled by ci-meta.yml.
name: CI

on:
  # push:
  #   branches-ignore:
  #     - 'chore/ci/**'
  # pull_request:
  #   branches:
  #     - main
  #     - rel/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-scope:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    outputs:
      has-common-scripts: ${{ steps.scope.outputs.has_common_scripts }}
      has-apps: ${{ steps.scope.outputs.has_apps }}
      has-supported-scope: ${{ steps.scope.outputs.has_supported_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for diff-based change detection

      - name: Detect changed scope
        id: scope
        uses: ./.github/actions/detect-change-scope
        with:
          allowed-paths-regex: ^([^/]+$|apps/|common/|scripts/)
          disallowed-paths-regex: \.github/(actions|workflows)/
          invalid-scope-message: .github/workflows/** and .github/actions/** cannot change in this workflow. Use ci-meta.yml instead.
          fail-on-invalid: 'true'

  commit-lint:
    name: Commit Message Format
    needs: detect-scope
    if: needs.detect-scope.outputs.has-supported-scope == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    uses: ./.github/workflows/wfc-commit-lint.yml

  format-lint:
    name: Biome Checks
    needs: detect-scope
    if: needs.detect-scope.outputs.has-supported-scope == 'true'
    uses: ./.github/workflows/wfc-format-lint.yml

  schema-tests:
    name: Schema Validation Tests
    needs:
      - detect-scope
      - format-lint
    if: false && needs.detect-scope.outputs.has-supported-scope == 'true'
    uses: ./.github/workflows/wfc-tests-schema.yml

  unit-tests:
    name: Unit Tests
    needs: detect-scope
    if: false && needs.detect-scope.outputs.has-apps == 'true'
    uses: ./.github/workflows/wfc-tests-unit.yml

  integration-tests:
    name: Integration Tests
    needs:
      - detect-scope
      - unit-tests
    if: false && needs.detect-scope.outputs.has-apps == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/wfc-tests-integration.yml

  e2e-tests:
    name: E2E Tests
    needs:
      - detect-scope
      - integration-tests
    if: false && needs.detect-scope.outputs.has-apps == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/wfc-tests-e2e.yml

# Security checks (npm audit, secret scanning, SAST) run in ci-quality-gates.yml
# release-please runs in release.yml
