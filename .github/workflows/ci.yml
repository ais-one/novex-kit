name: CI

on:
  pull_request:
    branches: ["rel/[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/ci-lint.yml
    permissions:
      contents: read

  tests:
    name: Tests
    needs: [lint]
    uses: ./.github/workflows/ci-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # only the secret it needs, not `inherit`
    permissions:
      contents: read

  quality-gates:
    name: Quality
    needs: [lint]
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit # GITLEAKS_LICENSE
    # a called workflow can't exceed these - union of what its jobs request
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
