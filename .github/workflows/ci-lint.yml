name: CI Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One job, one install. Each check step runs even if an earlier check failed
  # (`!cancelled()`), so every failure is reported in a single run; the job
  # fails if any step failed. Add new lint checks as steps here.
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the PR's base..head range resolves

      # Called from ci.yml, which only runs on pull_request - checks every commit in the PR.
      # Warn-only: PRs into rel/x.y are squash-merged, so branch commits are discarded and
      # only the PR title (enforced by ci-pr-title.yml) reaches the history git-cliff reads.
      # Runs before setup: needs only git, not node_modules.
      - name: Validate commit messages
        id: commit-lint
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|hotfix|chore)(\([^)]+\))?!?: .{1,}$'
          # To fail the step instead of warning, uncomment the FAILED lines below
          # FAILED=0

          git log --format="%s" "$PR_BASE_SHA..$PR_HEAD_SHA" > /tmp/commit_msgs.txt

          while IFS= read -r msg; do
            case "$msg" in
              Merge\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            if ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "::warning::Incorrect format: $msg"
              echo "refer to docs/git.md for required format"
              # FAILED=1
            fi
          done < /tmp/commit_msgs.txt
          # exit $FAILED

      - name: Set up workspace
        id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-node-npm-install
        with:
          install-command: npm ci --ignore-scripts

      - name: Biome CI (whole repository)
        id: format-lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run ci:biome

      # Same projects as the pre-push hook: each app's own tsconfig, plus the
      # shared group tsconfigs for common/, db/ and scripts/.
      - name: tsc --noEmit (every TS project)
        id: ts-lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          FAILED=0
          for PROJ in apps/* common db scripts; do
            [ -f "$PROJ/tsconfig.json" ] || continue
            echo "::group::tsc --noEmit -p $PROJ"
            if ! npx --no-install tsc --noEmit -p "$PROJ"; then
              echo "::error::Type check failed for project: $PROJ"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

      # todo/ holds drafts - GitHub does not run workflows in subfolders, so they are skipped
      - name: Check workflow and action YAML formatting
        id: lint-github-yaml
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:lint-yml
        # prettier pinned in root devDependencies
      # Image bundles shellcheck, so run: scripts are checked too.
      # Config (ignored false positives): .github/actionlint.yaml
      - name: Lint workflows (actionlint)
        id: actionlint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
