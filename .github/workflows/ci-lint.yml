## Lint workflow - commit message format, Biome lint/format, and workflow YAML (prettier + actionlint) checks.
## Runs on pull requests and pushes on every branch, with no change-scope detection.
## Biome is still limited to touched workspaces (detect-touched-workspaces);
## the first push of a new branch checks everything.
## Entry point for CI: once every lint job passes, it calls ci-tests.yml and
## ci-quality-gates.yml (reusable workflows) in parallel, on main and rel/x.y only.
name: Lint

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Message Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for diff-based change detection

      - name: Validate commit messages
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|chore)(\([^)]+\))?!?: .{1,}$'
          FAILED=0

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            RANGE="$PR_BASE_SHA..$PR_HEAD_SHA"
            git log --format="%s" "$RANGE" > /tmp/commit_msgs.txt
          elif [[ "$PUSH_BEFORE_SHA" == '0000000000000000000000000000000000000000' ]]; then
            git log --format="%s" -n 1 "$PUSH_HEAD_SHA" > /tmp/commit_msgs.txt
          else
            RANGE="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
            git log --format="%s" "$RANGE" > /tmp/commit_msgs.txt
          fi

          while IFS= read -r msg; do
            case "$msg" in
              Merge\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            if ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "::error::Non-conventional commit message: $msg"
              echo "  Expected: type(scope): description"
              echo "  Types:    feat|fix|chore"
              echo "  Note:     use chore for docs|style|refactor|perf|test|build|ci|revert changes"
              echo "  Tip:      use 'npx czg' locally to generate a valid message."
              FAILED=1
            fi
          done < /tmp/commit_msgs.txt
          exit $FAILED

  format-lint:
    name: Biome Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for diff-based change detection

      - name: Detect touched paths
        id: touched
        uses: ./.github/actions/detect-touched-workspaces

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      - name: Biome CI for touched targets
        if: steps.touched.outputs.has-biome-targets == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            echo "Running Biome CI for $target"
            npx biome ci "$target"
          done <<< "${{ steps.touched.outputs.biome-targets }}"

      - name: No touched Biome targets
        if: steps.touched.outputs.has-biome-targets != 'true'
        run: echo "No touched Biome targets detected for ${{ steps.touched.outputs.diff-range }}"

  lint-github-yaml:
    name: Lint Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install

      # todo/ holds drafts - GitHub does not run workflows in subfolders, so they are skipped
      - name: Check workflow and action YAML formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run quality:lint # prettier pinned in root devDependencies

      # Image bundles shellcheck, so run: scripts are checked too.
      # Config (ignored false positives): .github/actionlint.yaml
      - name: Lint workflows (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

  # ---------------------------------------------------------------------
  # Downstream workflows - run in parallel after lint passes, only for
  # PRs into / pushes to main or rel/[0-9]*.[0-9]* (same as their old triggers).
  # ---------------------------------------------------------------------
  branch-scope:
    name: Check Target Branch
    runs-on: ubuntu-latest
    outputs:
      protected: ${{ steps.scope.outputs.protected }}
    steps:
      - name: Match target branch against main / rel/[0-9]*.[0-9]*
        id: scope
        shell: bash
        env:
          # PR: the base branch; push: the pushed branch
          TARGET: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # regex form of the old `branches:` glob - `*` there matches anything except `/`
          if [[ "$TARGET" =~ ^(main|rel/[0-9][^/]*\.[0-9][^/]*)$ ]]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
            echo "$TARGET: running tests and quality gates"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "$TARGET: not main or rel/x.y - skipping tests and quality gates"
          fi

  tests:
    name: Tests
    needs: [branch-scope, commit-lint, format-lint, lint-github-yaml]
    if: needs.branch-scope.outputs.protected == 'true'
    uses: ./.github/workflows/ci-tests.yml
    permissions:
      contents: read

  quality-gates:
    name: Quality Gates
    needs: [branch-scope, commit-lint, format-lint, lint-github-yaml]
    if: needs.branch-scope.outputs.protected == 'true'
    uses: ./.github/workflows/ci-quality-gates.yml
    secrets: inherit # GITLEAKS_LICENSE, CODECOV_TOKEN
    # a called workflow can't exceed these - union of what its jobs request
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
