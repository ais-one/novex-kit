name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit Message Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the PR's base..head range resolves

      # Called from ci.yml, which only runs on pull_request - checks every commit in the PR.
      - name: Validate commit messages
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|chore)(\([^)]+\))?!?: .{1,}$'
          FAILED=0

          git log --format="%s" "$PR_BASE_SHA..$PR_HEAD_SHA" > /tmp/commit_msgs.txt

          while IFS= read -r msg; do
            case "$msg" in
              Merge\ *|fixup!\ *|squash!\ *) continue ;;
            esac
            if ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "::error::Non-conventional commit message: $msg"
              echo "  Expected: type(scope): description"
              echo "  Types:    feat|fix|chore"
              echo "  Note:     use chore for docs|style|refactor|perf|test|build|ci|revert changes"
              echo "  Tip:      use 'npx czg' locally to generate a valid message."
              FAILED=1
            fi
          done < /tmp/commit_msgs.txt
          exit $FAILED

  format-lint:
    name: Biome Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install
        with:
          install-command: npm ci --ignore-scripts

      - name: Biome CI (whole repository)
        run: npm run ci:biome

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install
        with:
          install-command: npm ci --ignore-scripts

      # Same projects as the pre-push hook: each app's own tsconfig, plus the
      # shared group tsconfigs for common/, db/ and scripts/.
      - name: tsc --noEmit (every TS project)
        shell: bash
        run: |
          set -uo pipefail
          FAILED=0
          for PROJ in apps/* common db scripts; do
            [ -f "$PROJ/tsconfig.json" ] || continue
            echo "::group::tsc --noEmit -p $PROJ"
            if ! npx --no-install tsc --noEmit -p "$PROJ"; then
              echo "::error::Type check failed for project: $PROJ"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

  lint-github-yaml:
    name: Lint Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install
        with:
          install-command: npm ci --ignore-scripts

      # todo/ holds drafts - GitHub does not run workflows in subfolders, so they are skipped
      - name: Check workflow and action YAML formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:lint-yml
        # prettier pinned in root devDependencies

      # Image bundles shellcheck, so run: scripts are checked too.
      # Config (ignored false positives): .github/actionlint.yaml
      - name: Lint workflows (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [commit-lint, format-lint, typecheck, lint-github-yaml] # add new lint jobs here
    # `failure` and `cancelled` fail the gate (lint jobs are never skipped)
    if: always()
    steps:
      - name: Check all lint jobs succeeded
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" || "$HAS_CANCELLED" == "true" ]]; then
            echo "::error::One or more lint jobs failed or were cancelled."
            exit 1
          fi
          echo "All lint checks passed."
