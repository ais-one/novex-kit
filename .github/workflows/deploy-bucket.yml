# This workflow deploys frontend application (VueJS) to a object store bucket
# Supported buckets:
# - Aliyun OSS
# - AWS S3 [TOTEST]
# - Github Pages [TOTEST]
#
# Setup the following secrets as environment secrets on the "production" environment
# (Settings → Environments → production → Environment secrets) - not repository secrets
# - ACCESS_KEY_ID
# - ACCESS_KEY_SECRET
# Setup the following github action repo vars
# - ENDPOINT
# Specify the following during build
# - provider (aws, oss, ghp)
# - tag
# - app (the web app folder in apps folder)
# - bucket (bucket name - e.g. test-www-dev)
# - env (development, statging, production)
#
name: 1 DEPLOY - Bucket

# on: [push]
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      provider:
        description: "Cloud Provider - oss, s3"
        required: true
        default: "oss"
        type: choice
        options:
          - oss
          - s3
      tag:
        description: "git repo branch or tag"
        default: "main"
        required: true
      app:
        description: "application name e.g. sample"
        default: ""
        required: true
      bucket:
        description: "bucket name e.g. test-www-dev"
        default: ""
        required: true
      environment:
        description: "deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  # OSS_TYPE: ${{ inputs.tag || 'main' }}
  DEPLOY_ENV: ${{ inputs.environment }}
  BUCKET: ${{ inputs.bucket }}
  APP: ${{ inputs.app }}

jobs:
  build:
    name: Install And Build
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: echo "$INPUTS"
      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Set up workspace
        uses: ./.github/actions/setup-node-npm-install
      - name: Build
        run: cd apps/$APP && npm run build --mode $DEPLOY_ENV
        # run: npm run build # will create a dist folder (TODO build environment??)
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-build
          path: ${{ github.workspace }}/apps/${{ inputs.app }}/dist

  deploy-oss: # aliyun OSS
    needs: build
    # "production" is a GitHub Environment configured with required reviewers - the job waits
    # for approval, and only then receives the environment secrets (ACCESS_KEY_ID/SECRET).
    # Settings → Environments → production → Required reviewers / Environment secrets
    environment: production
    if: inputs.provider == 'oss'
    name: Deploying To Aliyun OSS - Node Version TODO
    runs-on: ubuntu-latest
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: my-build
          path: ${{ github.workspace }}/apps/${{ inputs.app }}/dist
      - name: Install Alibaba Cloud OSSUTIL
        run: wget http://gosspublic.alicdn.com/ossutil/1.6.10/ossutil64 && chmod +x ossutil64
      - name: Configure Alibaba Cloud OSSUTIL
        run: ./ossutil64 config -i ${{ secrets.ACCESS_KEY_ID }} -k ${{ secrets.ACCESS_KEY_SECRET }} -e ${{ vars.ENDPOINT }} -c .ossutilconfig
      - name: Upload the web folder to the chosen OSS bucket
        run: ./ossutil64 --config-file .ossutilconfig cp ${{ github.workspace }}/apps/$APP/dist oss://$BUCKET -r -f
  deploy-s3: # AWS S3
    needs: build
    environment: production # see deploy-oss for setup
    if: inputs.provider == 's3'
    runs-on: ubuntu-latest
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: my-build
          path: ${{ github.workspace }}/apps/${{ inputs.app }}/dist
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACCESS_KEY_SECRET }}
          aws-region: us-east-1
      - name: Sync files to S3 bucket
        run: |
          aws s3 sync dist s3://$BUCKET --delete
  deploy-oss2: # Alibaba Cloud OSS via AWS CLI
    needs: build
    environment: production # see deploy-oss for setup
    if: inputs.provider == 'oss2'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: my-build
          path: ${{ github.workspace }}/apps/${{ inputs.app }}/dist
      - name: Configure AWS CLI for OSS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACCESS_KEY_SECRET }}
          aws-region: ap-southeast-1
      - name: Sync files to OSS bucket
        run: |
          aws s3 sync dist s3://$BUCKET \
            --delete \
            --endpoint-url https://${{ vars.ENDPOINT }}
  deploy-ghp: # Alibaba Cloud OSS via AWS CLI
    needs: build
    environment: production # see deploy-oss for setup
    if: inputs.provider == 'ghp'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: my-build
          path: ${{ github.workspace }}/apps/${{ inputs.app }}/dist
      - name: Run deploy script
        # remember to change user.name and user.email
        run: |
          git config user.name "Your username" && git config user.email "your email"
          git checkout --orphan gh-pages
          npx vite build --mode $DEPLOY_ENV
          git --work-tree dist add --all
          git --work-tree dist commit -m 'Deploy'
          git push origin HEAD:gh-pages --force
          rm -r dist
          git checkout -f "${GITHUB_REF##*/}"
          git branch -D gh-pages

# https://cli.vuejs.org/guide/deployment.html#github-pages
