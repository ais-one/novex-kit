# Manually triggered: builds a backend app's container image and pushes it to a container registry.
#   1. build            - shows the inputs
#   2. request-approval - waits for approval on the "production" GitHub Environment
#   3. deploy_to_cr     - checks out `tag_gr`, builds apps/<image name>/Dockerfile (target `runtime`)
#                         from the build context, then pushes <CR_HOST>/<CR_NAMESPACE>/<image name>:<tag_ci>
# The image name doubles as the app folder: it must match a folder in apps/ that has a Dockerfile.
# Deploying a pushed image to Alibaba Cloud SAE: deploy-sae.yml.
# Try to use as much shell scripting as possible.
# actions appear from default branch - https://github.community/t/workflow-files-only-picked-up-from-master/16129/2
#
# Supported Container Registries: AWS, Alicloud, Digital Ocean
#
# Setup the following secrets
# - CR_USERNAME: container registry login username (for deployment)
# - CR_PASSWORD: container registry login password (for deployment)
# Setup the following vars
# - CR_HOST: container registry host (for deployment)
# - CR_NAMESPACE: container registry namespace (for deployment)
# - CR_IMAGENAME: The image name (= app folder under apps/). If not specified, the repository name will be used
# Specify the following inputs
# - tag_gr
# - cr_imagename
# - tag_ci
# - dockerfile_path
# environment NOT needed as it is specified in the container orchestration platform.
name: 1 DEPLOY - Container Registry

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      tag_gr:
        description: "git repo branch or tag"
        default: "main"
        required: true
      cr_imagename:
        description: "container image name - leave blank to use GITHUB variables (if specified) or repo name"
        default: ""
        required: false
      tag_ci:
        description: "container image tag"
        default: "latest"
        required: true
      dockerfile_path: # kept for compatibility - it is the build context, not the Dockerfile path
        description: "docker build context (default: repo root) - the Dockerfile is always apps/<image name>/Dockerfile"
        default: "."
        required: false

env:
  CR_IMAGENAME: ${{ github.event.inputs.cr_imagename || vars.CR_IMAGENAME || github.event.repository.name }}
  CR_PASSWORD: ${{ secrets.CR_PASSWORD }}
  CR_USERNAME: ${{ secrets.CR_USERNAME }}
  CR_HOST: ${{ vars.CR_HOST }}
  CR_NAMESPACE: ${{ vars.CR_NAMESPACE }}
  DOCKERFILE_PATH: ${{ github.event.inputs.dockerfile_path || '.' }}
  DOCKERFILE_TARGET: runtime # follow value in docker file
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Show Workflow Inputs
        run: |
          echo "branch/tag: ${{ github.event.inputs.tag_gr }}"
          echo "image name: ${{ github.event.inputs.cr_imagename }}"
          echo "image tag: ${{ github.event.inputs.tag_ci }}"
          echo "docker file path: ${{ github.event.inputs.dockerfile_path }}"
  request-approval:
    name: Request Deployment Approval
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      # "production" is a GitHub Environment configured with required reviewers.
      # Add your authorized users/teams there in:
      #   Settings → Environments → production → Required reviewers
      # ← configure required reviewers here in GitHub Settings
      name: production
    steps:
      - name: Approval gate
        run: echo "✅ Approved — deploying ${{ github.event.inputs.tag_ci }}"

  deploy_to_cr:
    runs-on: ubuntu-latest
    name: Deploying CR
    needs: [request-approval]
    steps:
      - name: Add checkout plugin
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_gr }}
      - name: Build and push image to CR
        run: |
          # cat password.txt |
          echo "$CR_PASSWORD" | docker login --username "$CR_USERNAME" --password-stdin "$CR_HOST"
          docker build -f "apps/$CR_IMAGENAME/Dockerfile" \
            -t "$CR_HOST/$CR_NAMESPACE/$CR_IMAGENAME:${{ github.event.inputs.tag_ci }}" \
            --target "$DOCKERFILE_TARGET" \
            "$DOCKERFILE_PATH" || exit 1
          docker push "$CR_HOST/$CR_NAMESPACE/$CR_IMAGENAME:${{ github.event.inputs.tag_ci }}"
          docker logout
