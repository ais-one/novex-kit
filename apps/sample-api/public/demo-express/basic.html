<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Vanilla Javascript Samples</title>
</head>

<body>
  <h1>Basic Express <a href="index.html">Back</a></h1>
  <ul>
    <li><button type="button" onclick="testAPI('/api/healthcheck')">Express Server Health Check</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/healthcheck')">App Sample Health Check</button></li>
    <li><button type="button" onclick="testCors()">Test XHR CORS</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/check-db?conn=knex1&sql=SELECT 1')">Test DB Connection</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/tests/outbound?url=https://httpbin.org/get')">Test outbound unblocked</button></li>
    <li><button type="button" onclick="testStream('/api/sample-api/tests/stream')">Test return stream</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/tests/error')">Handled Exception - /api/error - caught by middleware</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/tests/error-not-found')">404 Not Found Error</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/tests/error-handled-rejection')">Handled Promise Rejection - /api/error-handled-rejection - caught by middleware</button></li>
    <li><button type="button" onclick="testAPI('/api/sample-api/tests/error-unhandled-rejection')">Unhandled Promise Rejection - /api/error-unhandled-rejection - caught by on.process - will crash the server</button></li>
  </ul>
  <p>
  <strong>NOTE:</strong> To test uncaught exception, need to uncomment "// openMissingFile()" in router/api.js
  </p>
  <pre id="output">Output will be shown here</pre>
</body>

<script>
  const outputEl = document.querySelector('#output')

  function testCors() {
    const requestBody = JSON.stringify({"aa": "a1", "bb": "b2"})
    const request = new XMLHttpRequest()
    request.open('POST', 'http://127.0.0.1:3000/api/sample-api/tests/test-cors-post')
    request.setRequestHeader('Access-Control-Allow-Origin', '<origin> | *')
    request.setRequestHeader("Content-Type", "application/json")
    request.responseType = 'text'
    request.onload = () => {
      outputEl.innerHTML = JSON.stringify(request.response, null, 2)
    }
    request.send(requestBody)
  }

  async function testAPI(url) {
    try {
      const res = await fetch(url, { method: 'GET' })
      const rv = await res.json()
      outputEl.innerHTML = JSON.stringify(rv, null, 2)
    } catch (e) {
      outputEl.innerHTML = JSON.stringify(e, null, 2)
      console.log(e)
    }
  }

  const testStream = (url) => {
    outputEl.innerHTML = ''
    fetch(url)
    .then(resp => resp.body)
    .then(body => {
      const reader = body.pipeThrough(new TextDecoderStream()).getReader()

      return new ReadableStream({
        start(controller) {
          return pump();
          function pump() {
            return reader.read().then(({ done, value }) => {
              if (value) {
                outputEl.innerHTML += `${value}<br/>`
              }
              // When no more data needs to be consumed, close the stream
              if (done) {
                outputEl.innerHTML += 'Stream Done<br/>'
                controller.close()
                return
              }
              // Enqueue the next data chunk into our target stream
              controller.enqueue(value);
              return pump()
            })
          }
        }
      })  
    })
  }
</script>

</html>
